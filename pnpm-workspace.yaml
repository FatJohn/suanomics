packages:
  - apps/*
  - packages/*

# 上層套件的最新版都還沒帶修正版，先用限定路徑的 override 清 Dependabot alert；
# 上層升到修正版後逐條移除。
overrides:
  # alert #15：@esbuild-kit/core-utils 3.3.2（latest）鎖 esbuild ~0.18.20，只能動這條路徑，
  # drizzle-kit、tsx、vite 自己的 esbuild 不受影響。
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  # alert #5：micromark-extension-math 3.1.0（latest）鎖 katex ^0.16.0。釘精確版本是因為
  # ^0.18.2 會解析到 0.18.11，那版已被標 deprecated（誤發 breaking changes）。
  micromark-extension-math>katex: 0.18.10
  # alert #2、#3：oxfmt 0.35.0 釘死 tinypool 2.1.0，而 eslint-plugin-format 2.0.1（latest）
  # 還鎖 oxfmt ^0.35.0。oxfmt 0.77 起帶 tinypool 2.2.0。
  oxfmt>tinypool: 2.1.2

packageExtensions:
  # @astrojs/astro2tsx 釘了 @emnapi/core 1.11.3，卻沒宣告 @emnapi/runtime；它依賴的
  # @napi-rs/wasm-runtime 把 runtime 列成 peer（^1.7.1 || 2.0.0-beta），autoInstallPeers
  # 會挑到 2.0.0-beta.2，跟 core 1.11.3 不合，astro check 一載入就崩潰
  # （this.bridge.setLastError is not a function）。overrides 管不到自動補的 peer，
  # 所以直接替 astro2tsx 補上同版號的 runtime。
  '@astrojs/astro2tsx':
    dependencies:
      '@emnapi/runtime': 1.11.3
# pnpm 11 用 allowBuilds 決定哪些依賴可以跑 install script（pkg → 是否允許）
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: true
