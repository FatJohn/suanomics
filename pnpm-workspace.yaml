packages:
  - apps/*
  - packages/*

overrides:
  # GHSA：@babel/core <=7.29.0 sourceMappingURL 任意讀檔、修補於 7.29.6；留在 babel 7 避免 major 8 不相容
  '@babel/core': ^7.29.6
  brace-expansion@>=5.0.0 <5.0.6: ^5.0.6
  esbuild: '>=0.28.1'
  fast-uri@<3.1.2: ^3.1.2
  # GHSA-2883-xcg3-v3hh：js-yaml <4.3.2 的 maxTotalMergeKeys 對空 merge source 無限流
  # 只鎖 4.x 範圍——apps/server 直接依賴 js-yaml 5.x（不受影響），不可全域降版
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  protobufjs: ^7.6.1
  undici: ^7.28.0
  ws: ^8.21.0
# pnpm 11 用 allowBuilds 取代 onlyBuiltDependencies（pkg → 是否允許跑 build script）
# true：原本就核可、需要 native build 的；false：pnpm 10 時就未核可、prod 正常運作、維持不建
allowBuilds:
  '@google/genai': false
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  unrs-resolver: true
  vue-demi: true
