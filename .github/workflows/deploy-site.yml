name: Deploy Site

# 網站程式碼 merge 進 main 後立即 build 與部署，不等隔天的 Daily Brief（#105）。
# 只跑 build 與 wrangler，不跑 pipeline、不呼叫 LLM；資料仍是 Postgres 裡已發佈的報告。
# 部署方式與 daily.yml 的 Build site、Deploy site 兩步相同，改其中一邊時兩邊一起改。

on:
  push:
    branches: [main]
    # 列的是會改變網站 build 產出的檔：網站與它依賴的 shared、依賴解析（lockfile、
    # workspace 的 overrides）、build 工具鏈（Node 版本、pnpm 版本、shared 的 tsconfig），
    # 以及本 workflow 自己。只改 apps/pipeline、apps/trigger 或文件的 push 不觸發。
    paths:
      - apps/web/**
      - packages/shared/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .nvmrc
      - tsconfig.base.json
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

# 與 daily.yml 同一個 group：兩邊都會部署整站，同時跑會互相覆蓋，改成排隊。
# 不取消進行中的 run，避免 Daily Brief 的 pipeline 跑到一半被網站部署打斷。
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm 版本取自 package.json 的 packageManager 欄位
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      # @suanomics/shared 的 exports 指向 dist，網站 build 前要先 build 過
      - name: Build
        run: pnpm -r build

      - name: Build site
        env:
          WEB_DATABASE_URL: ${{ secrets.WEB_DATABASE_URL }}
        run: pnpm --filter @suanomics/web run build:publish

      # --branch 要對應 Pages 的 production_branch，否則會變成 preview 部署。
      - name: Deploy site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4.158.0 pages deploy apps/web/dist --project-name suanomics --branch main
