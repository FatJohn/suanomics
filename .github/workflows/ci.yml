name: CI

# 程式碼的驗證 gate：build → lint → type-check → db:migrate → test。
# 真資料庫一律用 Postgres service container；Neon 的連線字串不進 CI。

on:
  pull_request:
    branches: [main, rewrite]
  push:
    branches: [main, rewrite]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 指向本 job 的 service container（GitHub 把 service port 映射到 localhost）
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm 版本取自 package.json 的 packageManager 欄位
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build 先於 type-check／test：@suanomics/shared 的 exports 指向 dist
      - name: Build
        run: pnpm -r build

      - name: Check packages/shared dependencies
        run: |
          node -e '
            const deps = Object.keys(JSON.parse(require("node:fs").readFileSync("packages/shared/package.json", "utf8")).dependencies ?? {});
            const extra = deps.filter(d => d !== "zod");
            if (extra.length > 0) { console.error("packages/shared 的 dependencies 只能有 zod，多了：" + extra.join(", ")); process.exit(1); }
          '

      # 釘版的 release binary，不裝成 npm 依賴
      - name: Install CI tools
        run: |
          mkdir -p "$RUNNER_TEMP/ci-tools/bin"
          cd "$RUNNER_TEMP/ci-tools"
          curl -fsSL -o zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  zizmor.tar.gz" | sha256sum -c -
          curl -fsSL -o ripgrep.tar.gz https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
          echo "33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c  ripgrep.tar.gz" | sha256sum -c -
          mkdir extracted
          tar -xzf zizmor.tar.gz -C extracted
          tar -xzf ripgrep.tar.gz -C extracted
          find extracted -type f \( -name zizmor -o -name rg \) -exec install -m 755 {} bin/ \;
          echo "$RUNNER_TEMP/ci-tools/bin" >> "$GITHUB_PATH"

      - name: Audit workflows
        run: zizmor --offline .github/workflows

      # ★（U+2605）不是 Unicode emoji，repo 註解用它標重點，所以不掃 U+2600-27BF 整段。
      # rg 結束碼：0 有命中、1 無命中、2 執行錯誤；只有 1 算通過。
      - name: Check emoji
        run: |
          status=0
          rg -n '\p{Emoji_Presentation}|\x{FE0F}' apps packages || status=$?
          test "$status" -eq 1

      - name: Knip
        run: pnpm knip

      - name: Check docs
        run: python3 tools/agents-guideline/check_docs.py --repo .

      - name: Check rules index
        run: python3 tools/agents-guideline/rules_index.py --repo . --config docs/rules/agent-rules.conf --check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm -r type-check

      # 從空 DB 套用全部 migration，驗 drizzle migration 機制
      - name: DB migrate
        run: pnpm --filter @suanomics/pipeline run db:migrate

      - name: Test
        run: pnpm -r test
