name: security

# 金鑰防線的 CI 層：每個 PR 與 push 都用 gitleaks 掃整段 git history。
# 本機 husky pre-commit 也跑 gitleaks，這裡擋的是繞過 hook（--no-verify、
# 沒裝 gitleaks、網頁上直接編輯）進來的 commit。

on:
  pull_request:
    branches: [main, rewrite]
  push:
    branches: [main, rewrite]

permissions:
  contents: read

jobs:
  # job id `gitleaks` 是 `rewrite` ruleset（id 26763831）的 required status check 名稱。
  # 改名或刪掉這個 job 前，先改 ruleset，否則進 `rewrite` 的 PR 會一直等不到這個 check。
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # gitleaks_8.30.1_linux_x64.tar.gz 的 sha256，與 release 的 checksums.txt 及 GitHub asset digest 一致。
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 不用第三方 gitleaks action：直接下載官方 release binary，以釘死的 sha256 驗證。
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
