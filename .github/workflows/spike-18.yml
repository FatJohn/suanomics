# 臨時 spike workflow（issue #18），PR 前刪除。
name: spike-18
on:
  push:
    branches-ignore: [main, rewrite]
    paths: ['spikes/18/**', '.github/workflows/spike-18.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe
        run: bash spikes/18/probe.sh
        # 不帶任何 secrets；所有探測邏輯在 spikes/18/probe.sh
