# writing-principles check_docs.py 的專案設定
# CLAUDE.md 只有一行 @AGENTS.md，免檔頭
NO_HEADER=CLAUDE.md
# docs/history/ 下從 macroeconomics-report 原樣搬來的歷史檔不改內容，不掃；docs/history/README.md 照掃
# docs/spikes/ 是 spike 當時的實驗紀錄，與 ADR 同屬留存證據
# apps/pipeline/src/prompts/README.md 由 v0 搬入、仍描述 v0 路徑，位於 #25 的改動範圍；內容整理後移出排除清單
# .agents/skills/neon*/ 是上游 neondatabase/agent-skills 原樣收錄的第三方 skill
EXCLUDE=apps/pipeline/src/prompts/README.md docs/history/changes/* docs/history/research/* docs/history/PRODUCT.md docs/spikes/* .agents/skills/neon/* .agents/skills/neon-postgres/*
