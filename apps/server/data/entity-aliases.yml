# Entity normalization seed.
#
# decomposer 出英文 entity（Fed / FOMC / TSMC）、
# 但 Gemini enrichment 對中文新聞 tag 用中文（聯準會 / 台積電）。retriever
# 的 GIN `entities @> [{name: E}]` 字面比對、字面不一致就 miss。
#
# 此 yml 是 alias dict source-of-truth、由 `apps/server/src/agents/
# entity-aliases.ts` 載入、retriever / routing 都用。
#
# 結構：
#   groups:
#     - canonical: <slug、僅內部識別、不曝露給 LLM>
#       aliases: [<可能在 decomposer 輸出 / external_articles tag 出現的所有同義 form>]
#
# 比對規則：
# - canonicalize 採 trim + case-insensitive：任一 alias / canonical 過 normalize
#   後都對應到同一個 canonical key
# - canonical 是 slug-only 識別碼（kebab-case、純小寫）、預設不會被當作真實
#   form 拿去 retriever GIN 查詢；正常 article tag 也不該寫成 slug。
# - expand 結果 = 使用者明確列在 aliases 裡的 form。所以**所有想被 retriever
#   命中的 form 都要明確列**（含 alias 也含 canonical 的可讀型；通常 canonical
#   slug 不需要列）。
# - 例外：若某 group 的 aliases 留空（不建議）、expand 會 fallback 回傳輸入
#   字串本身、避免回空陣列當查詢條件。
#
# 加新 alias：直接在這檔追加；container 重啟 / 下次 pnpm dev:server / next deploy
# 即生效（runtime 載入一次後 cache）。dev 加一條 entry 不需動 code。

