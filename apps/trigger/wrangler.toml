# 部署：pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4.158.0 deploy --config apps/trigger/wrangler.toml
# GitHub token 只放 Worker secret：pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4.158.0 secret put GITHUB_DISPATCH_TOKEN --config apps/trigger/wrangler.toml
name = "suanomics-trigger"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[triggers]
# 05:00 台北。Actions 的 schedule 備援在 05:20，見 ADR 0009。
crons = [ "0 21 * * *" ]
