# Topic 詞彙對照。
#
# 為什麼需要這份表：
# 2026-08-04 那次把 corpus enricher 的 prompt 改成「topicTags 一律英文
# 小寫 kebab-case」，external_articles.topic_tags 的 CJK 佔比因此從 7 月各週的
# 約 48% 掉到 8/10 當週的 0.1%、8/17 的 0.2%（prod 實測，以 fetched_at 分週）。
# decomposer 那邊沒有對應改動，仍照中文新聞吐中文 topic。字面比對的
# `topic_tags @>` 於是幾乎全空——2026-08-21 實跑三則真新聞，11 條 hypothesis
# 共 32 個 distinct topic，只有 3 個對得上 corpus（地緣政治 2 筆、logistics 2
# 筆、tariffs 13 筆）。
#
# 結構：
#   groups:
#     - canonical: <corpus 實際在用的 tag，英文小寫 kebab-case>
#       aliases: [<decomposer 可能吐出的其他 form，中英文皆可>]
#
# 與 entity-aliases.yml 的差異（不要照抄那邊的語意）：
# - 這裡的 canonical **就是 corpus 的 tag 本身**，不是內部 slug，會被拿去查詢。
# - 展開是加法：原字串永遠留著，再加上正規化形式與同組其他 form。corpus 有
#   字面大寫的 tag（實測 AI:55 筆），取代式展開會弄丟現在命中的查詢。
#
# 維護方式：
# - canonical 一律先確認「corpus 裡真的有這個 tag 且非零」再寫進來。
# - 對照的中文詞取自 corpus 自己的 legacy CJK tag（2026-08-04 之前同一個
#   enricher 對同樣概念用的中文），不是憑空翻譯。

