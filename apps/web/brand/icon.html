<!doctype html>
<!-- favicon 與 apple-touch-icon 的原稿：直接放刊頭 logo（public/logo-mark.svg），兩者共用同一張圖。
     畫布邊長由 brand/render.sh 用視窗大小決定，圖片用 vw 跟著縮放。 -->
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      img {
        display: block;
        width: 100vw;
        height: 100vw;
      }
    </style>
  </head>
  <body>
    <img src="../public/logo-mark.svg" alt="" />
  </body>
</html>
